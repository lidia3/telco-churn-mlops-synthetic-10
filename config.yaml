model_list:
  - model_name: chat
    litellm_params:
      model: ollama/mistral:7b-instruct-q4_K_M
      api_base: http://localhost:11434

  - model_name: chat-backup
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  fallbacks:
    - chat:
        - chat-backup
